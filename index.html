<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carburanti</title>
  <meta name="description" content="Prezzi dei carburanti vicino a te, dai dati dell'Osservatorio MIMIT.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carburanti">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Carburanti</h1>
      <span id="demo-badge" class="badge" hidden>DEMO</span>
      <button id="btn-refresh" class="icon-btn" aria-label="Aggiorna">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div id="zones" class="chips" role="radiogroup" aria-label="Zona"></div>
  </header>

  <main>
    <section class="controls" aria-label="Filtri">
      <div class="seg" id="seg-fuel" role="radiogroup" aria-label="Carburante">
        <button data-v="2">Gasolio</button><button data-v="1">Benzina</button><button data-v="4">GPL</button><button data-v="3">Metano</button>
      </div>
      <div class="row">
        <div class="seg seg-sm" id="seg-mode" role="radiogroup" aria-label="Modalità">
          <button data-v="1">Self</button><button data-v="0">Servito</button>
        </div>
        <div class="seg seg-sm" id="seg-radius" role="radiogroup" aria-label="Raggio">
          <button data-v="3">3</button><button data-v="5">5</button><button data-v="10">10</button><button data-v="15">15 km</button>
        </div>
      </div>
      <div class="row row-filters">
        <label class="select">
          <span class="sr-only">Ordina per</span>
          <select id="sel-sort">
            <option value="price">Prezzo</option>
            <option value="distance">Distanza</option>
            <option value="date">Aggiornamento</option>
          </select>
        </label>
        <label class="select">
          <span class="sr-only">Marchio</span>
          <select id="sel-brand"><option value="">Tutti i marchi</option></select>
        </label>
        <button id="tg-fresh" class="toggle" aria-pressed="false">≤ 24 h</button>
        <button id="tg-fav" class="toggle" aria-pressed="false" aria-label="Solo preferiti">★</button>
      </div>
    </section>

    <div id="notice" class="notice" hidden></div>
    <section id="summary" class="summary" aria-live="polite"></section>
    <section id="list" class="list" aria-live="polite"></section>
    <p class="foot">Fonte dati: Ministero delle Imprese e del Made in Italy – <a href="https://carburanti.mise.gov.it" target="_blank" rel="noopener">Osservatorio prezzi carburanti</a>
      (licenza <a href="https://www.dati.gov.it/iodl/2.0/" target="_blank" rel="noopener">IODL 2.0</a>).
      I prezzi sono comunicati dai gestori.<br>App personale, non affiliata al MIMIT.</p>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" data-close aria-label="Chiudi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="sheet-body"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
