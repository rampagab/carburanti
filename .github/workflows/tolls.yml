name: Tariffe pedaggi

# Aggiorna data/tolls.json: tariffe classe A di Autostrade per l'Italia (cambiano ogni 1° gennaio)
# e rete autostradale ART (tratte, concessionarie, quota di montagna). Si può lanciare anche a mano.
on:
  schedule:
    - cron: "41 6 5 1 *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica tariffe e rete
        run: python scripts/build_tolls.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tolls.json
          if git diff --cached --quiet; then echo "Nessuna novità."; exit 0; fi
          git commit -m "Tariffe pedaggi aggiornate"
          git push
          echo "PUSHED=1" >> "$GITHUB_ENV"
      - name: Ripubblica GitHub Pages
        if: env.PUSHED == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
