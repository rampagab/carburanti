name: Database auto

# Aggiorna data/cars/ dai dati ufficiali EEA (marca, modello, motorizzazione, consumo dichiarato).
# L'EEA pubblica un nuovo anno di immatricolazioni circa una volta l'anno: basta lanciarlo a mano
# (Actions › Database auto › Run workflow) o lasciare il controllo automatico di inizio luglio.
on:
  schedule:
    - cron: "23 5 3 7 *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica e prepara i dati
        run: python scripts/build_cars.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cars
          if git diff --cached --quiet; then echo "Nessuna novità."; exit 0; fi
          git commit -m "Database auto aggiornato"
          git push
          echo "PUSHED=1" >> "$GITHUB_ENV"
      - name: Ripubblica GitHub Pages
        if: env.PUSHED == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
