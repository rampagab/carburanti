<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pieno furbo</title>
  <meta name="description" content="Pieno furbo: prezzi dei carburanti, costi di viaggio e spese da dividere.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF4E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pieno furbo">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap">
  <script>
    // Aspetto del sistema: iOS (iPhone/iPad) o Android (Material). Prima del CSS, per evitare sfarfallii.
    (function () {
      var ua = navigator.userAgent, d = document.documentElement;
      var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      d.classList.add(ios ? "ios" : /Android/i.test(ua) ? "android" : "desktop");
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <img class="brand-mark" src="icons/logo-mark.svg" alt="" width="36" height="40">
      <h1 id="title">Pieno<br>furbo.</h1>
      <span id="demo-badge" class="badge" hidden>DEMO</span>
      <button id="btn-refresh" class="icon-btn" aria-label="Aggiorna">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="zones" class="chips" role="radiogroup" aria-label="Zona"></div>
  </header>

  <main>
    <section id="view-prezzi" class="view" aria-label="Prezzi">
      <div class="controls">
        <div class="pills" role="toolbar" aria-label="Filtri">
          <button class="pill pill-car" id="pill-car" data-panel="car" aria-expanded="false" aria-controls="panel-car"></button>
          <button class="pill" id="pill-route" data-panel="route" aria-expanded="false" aria-controls="panel-route"></button>
          <button class="pill" id="pill-radius" data-panel="radius" aria-expanded="false" aria-controls="panel-radius"></button>
          <button class="pill" id="pill-filters" data-panel="filters" aria-expanded="false" aria-controls="panel-filters">Filtri</button>
        </div>
        <div class="panel" id="panel-car" hidden>
          <h4>La tua auto</h4>
          <div class="opt-chips" id="car-chips"></div>
          <h4>Carburante</h4>
          <div class="seg" id="seg-fuel" role="radiogroup" aria-label="Carburante">
            <button data-v="2">Gasolio</button><button data-v="1">Benzina</button><button data-v="4">GPL</button><button data-v="3">Metano</button>
          </div>
          <div class="seg seg-sm" id="seg-mode" role="radiogroup" aria-label="Modalità">
            <button data-v="1">Self</button><button data-v="0">Servito</button>
          </div>
          <h4>Quanto metti</h4>
          <div class="opt-chips" id="qty-chips"></div>
        </div>
        <div class="panel" id="panel-route" hidden>
          <h4>Dopo il pieno</h4>
          <div class="opt-chips" id="route-chips"></div>
          <p class="muted small">Conto solo la strada in più per passare dal distributore.</p>
        </div>
        <div class="panel" id="panel-radius" hidden>
          <h4>Cerca entro</h4>
          <div class="seg" id="seg-radius" role="radiogroup" aria-label="Raggio in km">
            <button data-v="3">3 km</button><button data-v="5">5 km</button><button data-v="10">10 km</button><button data-v="15">15 km</button>
          </div>
        </div>
        <div class="panel" id="panel-filters" hidden>
          <div class="row row-filters">
            <label class="select">
              <span class="sr-only">Ordina per</span>
              <select id="sel-sort"></select>
            </label>
            <label class="select">
              <span class="sr-only">Marchio</span>
              <select id="sel-brand"><option value="">Tutti i marchi</option></select>
            </label>
            <button id="tg-fresh" class="toggle" aria-pressed="false">≤ 24 h</button>
            <button id="tg-fav" class="toggle" aria-pressed="false" aria-label="Solo preferiti">★</button>
          </div>
          <label class="field tv"><span>Quanto vale il tuo tempo</span>
            <span class="inline"><input id="in-timevalue" type="number" inputmode="decimal" min="0" max="100" step="1"><span class="unit">€/ora</span></span>
            <small class="muted">Con 0 conta solo il carburante. Con, per esempio, 10 €/ora una deviazione di 6 minuti pesa 1 €.</small></label>
        </div>
      </div>
      <div id="notice" class="notice" hidden></div>
      <section id="summary" class="summary" aria-live="polite"></section>
      <section id="list" class="list" aria-live="polite"></section>
      <p class="foot">Dati: <a href="https://carburanti.mise.gov.it" target="_blank" rel="noopener">MIMIT</a>, licenza <a href="https://www.dati.gov.it/iodl/2.0/" target="_blank" rel="noopener">IODL 2.0</a>. App personale, non affiliata.</p>
    </section>
    <section id="view-viaggio" class="view" aria-label="Viaggio" hidden></section>
    <section id="view-spese" class="view" aria-label="Spese" hidden></section>
    <section id="view-auto" class="view" aria-label="Garage" hidden></section>
    <section id="view-altro" class="view" aria-label="Altro" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Menu">
    <a href="#prezzi" data-tab="prezzi"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h14M8 7h4M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></span><span class="tl">Prezzi</span></a>
    <a href="#viaggio" data-tab="viaggio"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span><span class="tl">Viaggio</span></a>
    <a href="#spese" data-tab="spese"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 6"/></svg></span><span class="tl">Spese</span></a>
    <a href="#auto" data-tab="auto"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM5 11h14"/><circle cx="7.5" cy="16" r="1"/><circle cx="16.5" cy="16" r="1"/></svg></span><span class="tl">Garage</span></a>
    <a href="#altro" data-tab="altro"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span><span class="tl">Altro</span></a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" data-close aria-label="Chiudi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="sheet-body"></div>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
